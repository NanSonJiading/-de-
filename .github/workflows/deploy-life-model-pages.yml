name: Deploy Life Model to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'life-model/**'
      - '.github/workflows/deploy-life-model-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: life-model
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
